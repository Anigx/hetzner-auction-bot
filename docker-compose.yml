services:
  bot:
    image: ghcr.io/anigx/hetzner-auction-bot:latest
    # Fuer reproduzierbare Deploys stattdessen eine feste Version pinnen:
    # image: ghcr.io/anigx/hetzner-auction-bot:0.1.1
    container_name: hetzner-auction-bot
    env_file: .env
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "hetzner_bot.healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 2m

volumes:
  bot-data:
    name: hetzner-auction-bot-data
